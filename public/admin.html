<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Kudos Portal</title>
  <script src="/js/theme-init.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/fonts.css">
  <link rel="stylesheet" href="/css/material.css">
  <link rel="stylesheet" href="/css/theme-dark.css">
</head>
<body>
  <div class="top-app-bar">
    <h1>Admin Dashboard</h1>
    <nav>
      <a href="/dashboard">Dashboard</a>
      <a href="/kudos">Kudos</a>
      <a href="/feedback">Feedback</a>
      <a href="/admin">Admin</a>
      <div class="theme-toggle" role="radiogroup" aria-label="Theme selection">
        <button class="theme-option" data-theme="light" role="radio" aria-checked="false" aria-label="Light theme" title="Light theme">☀️</button>
        <button class="theme-option" data-theme="dark" role="radio" aria-checked="false" aria-label="Dark theme" title="Dark theme">🌙</button>
        <button class="theme-option" data-theme="system" role="radio" aria-checked="true" aria-label="System theme" title="Follow system preference">💻</button>
      </div>
      <div class="user-info">
        <span class="user-info-name" id="user-name"></span>
        <button class="button button-text" onclick="logout()">Logout</button>
      </div>
    </nav>
  </div>

  <div class="container">
    <h2>User Management</h2>
    <p style="margin-bottom: 24px; color: var(--md-sys-color-on-surface-variant);">
      Manage user accounts and permissions.
    </p>

    <div id="users-table"></div>

    <h2 style="margin-top: 48px;">All Feedback</h2>
    <p style="margin-bottom: 24px; color: var(--md-sys-color-on-surface-variant);">
      View all feedback submissions including anonymous authors.
    </p>

    <div id="feedback-list"></div>
  </div>

  <script src="/js/theme.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    if (window.themeManager) {
      window.themeManager.init();
    }
  </script>
  <script src="/js/admin.js"></script>
</body>
</html>
