name: Build
on:
  workflow_dispatch:
  
  # Every PR to main/develop — fires on open, push to branch, reopen
  pull_request:
    branches: [main, develop, 'epic/**', redesign, '[a-h][0-9]-*']

  # Feature branches opted-in via naming convention (no open PR required)
  push:
    branches:
      - 'sonar/**'
      - 'feat/**'
      - main
      - develop
      - hunter-agent

  schedule:
    - cron: '0 2 * * 1-5'   # nightly Mon–Fri at 2am
    
jobs:
  sonarqube:  
    name: SonarQube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 26
      
      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          
      - name: Normalize bun.lock files to use public registry
        run: bash scripts/normalize-bun-lock-registry.sh . .
        
      - name: Install Dependencies
        run: bun install

      - name: Run Tests and Generate Coverage
        run: bun test --coverage

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@59db25f34e16620e48ab4bb9e4a5dce155cb5432 # v8.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
