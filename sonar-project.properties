sonar.projectKey=SonarCloud-Demos_jimhalkyard-kudos
sonar.organization=sonarcloud-demos


# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=jimhalkyard-kudos
#sonar.projectVersion=1.0


# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
#sonar.sources=.

# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8

# Coverage exclusions - CSS and HTML files don't require test coverage
sonar.coverage.exclusions=**/*.css,**/*.html

# Duplication exclusions - CSS naturally has repeated patterns
sonar.cpd.exclusions=**/*.css

# JavaScript test files location
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.js
